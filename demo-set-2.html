<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAARD ENGLISH CAMP 2026: Create Your Own Superhero!</title>
  <style>
    :root {
      --bg-paper: #fdfbf7;
      --comic-ink: #111827;
      --hero-red: #ef4444;
      --hero-blue: #2563eb;
      --hero-yellow: #facc15;
      --hero-cyan: #06b6d4;
      --hero-green: #10b981;
      --hero-purple: #8b5cf6;
      --panel-bg: #ffffff;
      --muted: #4b5563;
      --border-w: 3px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #e0f2fe;
      background-image: radial-gradient(#93c5fd 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: var(--comic-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Comic-Book Typography & Panel Utilities */
    .comic-font {
      font-family: "Trebuchet MS", "Arial Black", Impact, sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .comic-panel {
      background: var(--panel-bg);
      border: var(--border-w) solid var(--comic-ink);
      border-radius: 16px;
      box-shadow: 6px 6px 0px var(--comic-ink);
    }

    .comic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--hero-yellow);
      color: var(--comic-ink);
      border: 2px solid var(--comic-ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 0.78rem;
      box-shadow: 2px 2px 0px var(--comic-ink);
    }

    .comic-btn {
      cursor: pointer;
      font-weight: 700;
      border: 2.5px solid var(--comic-ink);
      border-radius: 12px;
      padding: 8px 14px;
      background: #ffffff;
      color: var(--comic-ink);
      box-shadow: 3px 3px 0px var(--comic-ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.88rem;
      user-select: none;
    }

    .comic-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--comic-ink);
      background: #fef9c3;
    }

    .comic-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--comic-ink);
    }

    .comic-btn.primary {
      background: var(--hero-blue);
      color: #ffffff;
    }
    .comic-btn.primary:hover {
      background: #1d4ed8;
    }

    .comic-btn.danger {
      background: var(--hero-red);
      color: #ffffff;
    }

    .comic-btn.success {
      background: var(--hero-green);
      color: #ffffff;
    }

    .comic-btn.warning {
      background: var(--hero-yellow);
      color: var(--comic-ink);
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #dc2626 100%);
      color: #ffffff;
      border-bottom: 4px solid var(--comic-ink);
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
      pointer-events: none;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .title-group h1 {
      font-size: clamp(1.35rem, 2.8vw, 2.1rem);
      text-shadow: 3px 3px 0px var(--comic-ink);
      line-height: 1.15;
      margin-top: 6px;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .meta-pill {
      background: rgba(17, 24, 39, 0.72);
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-pill strong {
      color: var(--hero-yellow);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 18px auto;
      padding: 0 16px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Navigation Tabs */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) {
      .tabs-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .tabs-bar button:last-child {
        grid-column: span 2;
      }
    }

    .tab-btn {
      cursor: pointer;
      background: #ffffff;
      border: 3px solid var(--comic-ink);
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 800;
      font-size: 0.86rem;
      color: var(--comic-ink);
      box-shadow: 4px 4px 0px var(--comic-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: #fef08a;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--hero-yellow);
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--comic-ink);
    }

    /* Playback Toolbar */
    .playback-bar {
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fffbeb;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scrubber-wrap {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scrubber-label {
      font-weight: 800;
      font-size: 0.8rem;
      white-space: nowrap;
      background: var(--comic-ink);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
    }

    input[type="range"].comic-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border: 2px solid var(--comic-ink);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].comic-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--hero-red);
      border: 2.5px solid var(--comic-ink);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--comic-ink);
    }

    /* Workspace Grid */
    .workspace {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width: 960px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    /* Stage Canvas Box */
    .stage-box {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
    }

    .stage-header {
      background: var(--comic-ink);
      color: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-header h2 {
      font-size: 1.05rem;
      color: var(--hero-yellow);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 340px;
      background: #f8fafc;
    }

    canvas#sceneCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Interactive Controls inside Stage Box */
    .stage-interactive-bar {
      padding: 12px 16px;
      background: #f1f5f9;
      border-top: 3px solid var(--comic-ink);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Right Side Guide & Interactive Panel */
    .info-panel {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 680px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.15rem;
      border-bottom: 3px solid var(--comic-ink);
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-card {
      border: 2px solid var(--comic-ink);
      border-radius: 12px;
      padding: 10px 12px;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    .step-card.active-step {
      background: #fef9c3;
      border-width: 3px;
      box-shadow: 4px 4px 0px var(--comic-ink);
      transform: translateX(3px);
    }

    .step-num {
      display: inline-block;
      background: var(--hero-blue);
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1.5px solid var(--comic-ink);
      margin-right: 6px;
    }

    /* Checklist Styling */
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 2px solid var(--comic-ink);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .checklist-item:hover {
      background: #f0fdf4;
    }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--hero-green);
      cursor: pointer;
    }

    .checklist-item.checked span {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* Helpful English Expressions Cards */
    .expr-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .expr-card {
      border: 2px solid var(--comic-ink);
      border-radius: 10px;
      padding: 8px 12px;
      background: #eff6ff;
      cursor: pointer;
      transition: all 0.15s;
    }

    .expr-card:hover, .expr-card.highlighted {
      background: var(--hero-yellow);
      box-shadow: 3px 3px 0px var(--comic-ink);
    }

    .expr-phrase {
      font-weight: 800;
      color: #1e3a8a;
      font-size: 0.92rem;
    }

    .expr-purpose {
      font-size: 0.78rem;
      color: #374151;
    }

    /* Scoring Sliders */
    .score-row {
      border: 2px solid var(--comic-ink);
      border-radius: 12px;
      padding: 10px 12px;
      background: #ffffff;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.86rem;
      margin-bottom: 6px;
    }

    .total-score-banner {
      background: linear-gradient(135deg, #facc15, #f59e0b);
      border: 3px solid var(--comic-ink);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 4px 4px 0px var(--comic-ink);
    }

    .total-score-banner .big-num {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }

    /* Mini Builder Pill Group */
    .builder-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .swatch-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid var(--comic-ink);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--comic-ink);
    }
    .swatch-btn.selected {
      outline: 3px solid var(--hero-yellow);
      transform: scale(1.12);
    }

    /* Pulse Keyframe */
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.25s ease-out;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="title-group">
        <span class="comic-badge">⚡ SAARD ENGLISH CAMP 2026 • GAME ACTIVITY</span>
        <h1 class="comic-font">Create Your Own Superhero!</h1>
      </div>
      <div class="meta-pills">
        <div class="meta-pill">
          <span>📅</span>
          <div><strong>Date:</strong> November 28-29, 2026</div>
        </div>
        <div class="meta-pill">
          <span>🦸‍♂️</span>
          <div><strong>Proctor:</strong> Mr. Jose Cer Gapay Bundalian</div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- 5 INTERACTIVE TABS -->
    <nav class="tabs-bar" aria-label="Activity Stages">
      <button class="tab-btn active" data-tab="0" onclick="selectTab(0)">
        <span>🏫</span> Tab 1: Overview &amp; Setup
      </button>
      <button class="tab-btn" data-tab="1" onclick="selectTab(1)">
        <span>📽️</span> Tab 2: Stage 1 - Meet Heroes
      </button>
      <button class="tab-btn" data-tab="2" onclick="selectTab(2)">
        <span>🎨</span> Tab 3: Stage 2 - Create Hero
      </button>
      <button class="tab-btn" data-tab="3" onclick="selectTab(3)">
        <span>🎤</span> Tab 4: Stage 3 - Present Hero
      </button>
      <button class="tab-btn" data-tab="4" onclick="selectTab(4)">
        <span>🏆</span> Tab 5: Scoring &amp; Reminders
      </button>
    </nav>

    <!-- PLAYBACK CONTROLS -->
    <div class="comic-panel playback-bar">
      <div class="playback-buttons">
        <button id="btnPlayPause" class="comic-btn primary" onclick="togglePlay()">
          <span id="playIcon">⏸️</span> <span id="playText">Pause</span>
        </button>
        <button class="comic-btn" onclick="replayStage()">
          🔄 Replay
        </button>
        <button id="btnSpeed" class="comic-btn warning" onclick="cycleSpeed()">
          ⚡ Speed: 1x
        </button>
      </div>

      <div class="scrubber-wrap">
        <span class="scrubber-label" id="timeLabel">0%</span>
        <input type="range" id="timelineScrubber" class="comic-slider" min="0" max="100" value="0" oninput="scrubTimeline(this.value)" />
        <span class="scrubber-label" id="phaseCaption">Classroom Ready</span>
      </div>
    </div>

    <!-- WORKSPACE: LEFT ANIMATION STAGE + RIGHT INTERACTIVE GUIDE -->
    <div class="workspace">

      <!-- LEFT: ANIMATED CANVAS STAGE -->
      <section class="comic-panel stage-box">
        <div class="stage-header">
          <h2 class="comic-font" id="stageHeaderTitle">Overview &amp; Classroom Setup</h2>
          <span class="comic-badge" id="stageBadge">SETUP PHASE</span>
        </div>

        <div class="canvas-container" id="canvasWrapper">
          <canvas id="sceneCanvas"></canvas>
        </div>

        <!-- CONTEXTUAL INTERACTIVE CONTROLS BAR -->
        <div class="stage-interactive-bar" id="contextualBar">
          <!-- Populated dynamically per tab -->
        </div>
      </section>

      <!-- RIGHT: SYNCHRONIZED GUIDE & INTERACTIVE WIDGETS -->
      <aside class="comic-panel info-panel" id="rightPanel">
        <!-- Populated dynamically per tab -->
      </aside>

    </div>
  </div>

  <script>
    // =========================================================================
    // DATA MODEL (Strictly aligned with SAARD ENGLISH CAMP 2026 PDF)
    // =========================================================================
    const MATERIALS_LIST = [
      { id: "m1", qty: "1", name: "Computer or laptop with superhero presentation slides", checked: true },
      { id: "m2", qty: "1", name: "Projector or large screen", checked: true },
      { id: "m3", qty: "1 per group", name: "Large sheet of drawing paper or poster paper", checked: true },
      { id: "m4", qty: "As needed", name: "Colored pencils, crayons, or markers", checked: false },
      { id: "m5", qty: "As needed", name: "Pencils and erasers", checked: false },
      { id: "m6", qty: "As needed", name: "Rulers or other drawing materials", checked: false }
    ];

    const SAMPLE_SLIDES = [
      {
        name: "CAPTAIN SOLAR",
        catchphrase: "\"With the power of the sun, darkness is done!\"",
        power: "He can absorb sunlight to fly fast and power clean energy for towns.",
        helps: "He helps communities during power outages and protects nature.",
        suitColor: "#ef4444",
        capeColor: "#facc15",
        emblem: "☀️"
      },
      {
        name: "AQUA GUARDIAN",
        catchphrase: "\"Every drop counts—let's keep our rivers clean!\"",
        power: "She can purify polluted water and breathe underwater.",
        helps: "She helps fish, sea animals, and villages that need clean drinking water.",
        suitColor: "#0284c7",
        capeColor: "#38bdf8",
        emblem: "💧"
      },
      {
        name: "MIND SPARK",
        catchphrase: "\"Think smart, stay kind, and solve any puzzle!\"",
        power: "He can build helpful inventions in seconds and speak every language.",
        helps: "He helps students, travelers, and elderly neighbors stay safe and connected.",
        suitColor: "#7c3aed",
        capeColor: "#f43f5e",
        emblem: "⚡"
      }
    ];

    const ORIGINAL_PRESETS = [
      {
        name: "CAPTAIN ECO",
        catchphrase: "\"Plant a tree today, save the Earth hooray!\"",
        power: "grow giant trees and clean up trash",
        helps: "forests, animals, and our school neighborhood",
        uses: "plant gardens and stop pollution",
        suitColor: "#10b981",
        capeColor: "#facc15",
        emblem: "🌱",
        hasCape: true
      },
      {
        name: "DOCTOR BREEZE",
        catchphrase: "\"Fresh wind blows, and everyone glows!\"",
        power: "fly with gentle winds and heal sick people",
        helps: "children, hospitals, and people in storms",
        uses: "carry medicine quickly and cool hot cities",
        suitColor: "#06b6d4",
        capeColor: "#2563eb",
        emblem: "🌪️",
        hasCape: true
      }
    ];

    const HELPFUL_EXPRESSIONS = [
      { phrase: "Our superhero's name is...", purpose: "Introduce the superhero.", sample: "Our superhero's name is Captain Eco!" },
      { phrase: "His/Her special power is...", purpose: "Describe a power.", sample: "His special power is growing trees instantly!" },
      { phrase: "He/She can...", purpose: "Explain what the superhero is able to do.", sample: "He can clean polluted rivers and fly over cities." },
      { phrase: "He/She helps...", purpose: "Identify the people, animals, or community the superhero helps.", sample: "He helps animals, trees, and people in our town." },
      { phrase: "He/She uses this power to...", purpose: "Explain how the power helps others.", sample: "He uses this power to make our community green and safe." },
      { phrase: "Our catchphrase is...", purpose: "Introduce the superhero's catchy line.", sample: "Our catchphrase is: 'Plant a tree today, save the Earth hooray!'" }
    ];

    const PROCTOR_REMINDERS = [
      "Choose clear, age-appropriate superhero images and catchphrases for the screen presentation.",
      "Allow students time to read, repeat, and understand the catchphrases before beginning the group task.",
      "Remind students that their superhero must be original and that every group member should participate.",
      "Encourage simple, complete English sentences. Focus on communication and confidence rather than perfect grammar.",
      "Make sure every group has an opportunity to present and that students listen respectfully to one another.",
      "Praise creative ideas, positive messages, and superheroes whose powers are used to help others."
    ];

    // =========================================================================
    // APPLICATION STATE
    // =========================================================================
    const state = {
      activeTab: 0,
      isPlaying: true,
      speed: 1,
      progress: 0, // 0 to 100
      lastTimestamp: 0,
      cycleDuration: 14000, // 14 seconds per stage loop at 1x

      // Tab 1 (Stage 1) Interactive State
      slideIndex: 0,
      manualSlideOverride: false,

      // Tab 2 (Stage 2) Mini Superhero Builder State
      heroBuilder: {
        name: "CAPTAIN ECO",
        suitColor: "#10b981",
        capeColor: "#facc15",
        emblem: "🌱",
        hasCape: true,
        catchphrase: "\"Plant a tree today, save the Earth hooray!\""
      },

      // Tab 3 (Stage 3) Presentation Expression Highlight
      selectedExprIndex: 0,
      manualExprOverride: false,

      // Tab 4 (Scoring) Interactive Rubric State
      scores: {
        creativity: 3,    // max 3
        catchphrase: 2,   // max 2
        explanation: 3,   // max 3
        teamwork: 2       // max 2
      },
      checkedReminders: [true, true, false, false, false, false]
    };

    // =========================================================================
    // CANVAS SETUP & RESPONSIVE RESIZING
    // =========================================================================
    const canvas = document.getElementById("sceneCanvas");
    const ctx = canvas.getContext("2d");
    const canvasWrapper = document.getElementById("canvasWrapper");

    function resizeCanvas() {
      const rect = canvasWrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(300, Math.floor(rect.width * dpr));
      canvas.height = Math.max(200, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);

    // =========================================================================
    // TAB & PLAYBACK CONTROLS
    // =========================================================================
    function selectTab(index) {
      state.activeTab = index;
      state.progress = 0;
      state.manualSlideOverride = false;
      state.manualExprOverride = false;

      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });

      renderContextualBar();
      renderRightPanel();
      updatePlaybackUI();
    }

    function togglePlay() {
      state.isPlaying = !state.isPlaying;
      document.getElementById("playIcon").textContent = state.isPlaying ? "⏸️" : "▶️";
      document.getElementById("playText").textContent = state.isPlaying ? "Pause" : "Play";
    }

    function replayStage() {
      state.progress = 0;
      state.manualSlideOverride = false;
      state.manualExprOverride = false;
      if (!state.isPlaying) togglePlay();
      updatePlaybackUI();
    }

    function cycleSpeed() {
      const speeds = [0.5, 1, 1.5];
      const nextIdx = (speeds.indexOf(state.speed) + 1) % speeds.length;
      state.speed = speeds[nextIdx];
      document.getElementById("btnSpeed").textContent = `⚡ Speed: ${state.speed}x`;
    }

    function scrubTimeline(val) {
      state.progress = parseFloat(val);
      updatePlaybackUI();
    }

    function updatePlaybackUI() {
      const pct = Math.round(state.progress);
      document.getElementById("timelineScrubber").value = state.progress;
      document.getElementById("timeLabel").textContent = `${pct}%`;

      // Update phase caption and highlight active step card
      const phaseInfo = getCurrentPhaseInfo();
      document.getElementById("phaseCaption").textContent = phaseInfo.caption;

    function getCurrentPhaseInfo() {
      const p = state.progress;
      switch (state.activeTab) {
        case 0:
          if (p < 25) return { stepIndex: 0, caption: "1. Prepare Superhero Slides" };
          if (p < 50) return { stepIndex: 1, caption: "2. Check Computer & Projector" };
          if (p < 75) return { stepIndex: 2, caption: "3. Distribute Poster & Art Tools" };
          return { stepIndex: 3, caption: "4. Form Groups & Explain Originality" };
        case 1:
          if (p < 25) return { stepIndex: 0, caption: "Step 6: Look at Screen" };
          if (p < 50) return { stepIndex: 1, caption: "Step 7: Read Name Aloud" };
          if (p < 75) return { stepIndex: 2, caption: "Step 8: Repeat Catchphrase" };
          return { stepIndex: 3, caption: "Step 9: Discuss Special Powers" };
        case 2:
          if (p < 25) return { stepIndex: 0, caption: "Step 10: Brainstorm Original Hero" };
          if (p < 55) return { stepIndex: 1, caption: "Step 11: Draw Costume & Emblem" };
          if (p < 80) return { stepIndex: 2, caption: "Step 12: Write Catchy Line" };
          return { stepIndex: 3, caption: "Step 13: Plan Explanation" };
        case 3:

          if (p < 50) return { stepIndex: 1, caption: "Step 15: Say Catchphrase Together" };
          if (p < 75) return { stepIndex: 2, caption: "Step 16-17: Explain Powers & Help" };

    // =========================================================================
    // HTML5 CANVAS DRAWING HELPERS (COMIC VECTOR ART)
    // =========================================================================
    function drawComicBox(x, y, w, h, fill, stroke = "#111827", lineWidth = 3, radius = 12, shadowOffset = 4) {
      if (shadowOffset > 0) {
        ctx.fillStyle = stroke;
        roundRectPath(x + shadowOffset, y + shadowOffset, w, h, radius);
        ctx.fill();
      }
      ctx.fillStyle = fill;
      roundRectPath(x, y, w, h, radius);
      ctx.fill();
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawSpeechBubble(x, y, w, h, tailX, tailY, text, bg = "#ffffff", fontSize = 13) {
      ctx.save();
      // Shadow
      ctx.fillStyle = "#111827";
      roundRectPath(x + 3, y + 3, w, h, 12);
      ctx.fill();

      // Bubble body + tail
      ctx.fillStyle = bg;
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2.5;
      roundRectPath(x, y, w, h, 12);
      ctx.fill();
      ctx.stroke();

      // Tail triangle
      const baseX = Math.max(x + 16, Math.min(x + w - 16, tailX));
      const isBottom = tailY > y + h / 2;
      const baseY = isBottom ? y + h - 1 : y + 1;
      ctx.beginPath();
      ctx.moveTo(baseX - 8, baseY);
      ctx.lineTo(tailX, tailY);
      ctx.lineTo(baseX + 8, baseY);
      ctx.closePath();
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.stroke();

      // Text wrapping
      ctx.fillStyle = "#111827";
      ctx.font = `700 ${fontSize}px "Segoe UI", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      wrapText(text, x + w / 2, y + h / 2, w - 18, fontSize + 4);
      ctx.restore();
    }

    function wrapText(text, cx, cy, maxWidth, lineHeight) {
      const words = text.split(" ");
      const lines = [];
      let current = "";
      for (let word of words) {
        const test = current ? current + " " + word : word;
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);

      const startY = cy - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, cx, startY + i * lineHeight);
      });
    }

    function drawClassroomBackdrop(W, H) {
      // Wall
      ctx.fillStyle = "#fef9c3";
      ctx.fillRect(0, 0, W, H * 0.68);

      // Subtle comic halftone dots on wall
      ctx.fillStyle = "rgba(250, 204, 21, 0.25)";
      for (let gx = 16; gx < W; gx += 26) {
        for (let gy = 16; gy < H * 0.65; gy += 26) {
          ctx.beginPath();
          ctx.arc(gx, gy, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Wall trim
      ctx.fillStyle = "#93c5fd";
      ctx.fillRect(0, H * 0.65, W, H * 0.04);
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.65);
      ctx.lineTo(W, H * 0.65);
      ctx.stroke();

      // Floor
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(0, H * 0.69, W, H * 0.31);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.69);
      ctx.lineTo(W, H * 0.69);
      ctx.stroke();

      // Camp Banner
      drawComicBox(W * 0.03, H * 0.04, W * 0.24, H * 0.11, "#ef4444", "#111827", 2.5, 8, 3);
      ctx.fillStyle = "#ffffff";
      ctx.font = `900 ${Math.max(10, W * 0.015)}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("SAARD CAMP 2026", W * 0.15, H * 0.095);
    }

    function drawChibiPerson(x, y, scale, opts = {}) {
      const {
        shirt = "#2563eb",
        hair = "#1f2937",
        skin = "#fde68a",
        wave = 0,
        isProctor = false,
        facing = 1
      } = opts;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Torso
      ctx.fillStyle = shirt;
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2.5;
      roundRectPath(-16, 14, 32, 34, 10);
      ctx.fill();
      ctx.stroke();

      // Tie/Badge for Proctor
      if (isProctor) {
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.lineTo(-4, 34);
        ctx.lineTo(0, 39);
        ctx.lineTo(4, 34);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Arms
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.strokeStyle = shirt;
      // Left arm
      ctx.beginPath();
      ctx.moveTo(-15, 20);
      ctx.lineTo(-26, 32 - wave * 14);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      // Right arm
      ctx.lineWidth = 6;
      ctx.strokeStyle = shirt;
      ctx.beginPath();
      ctx.moveTo(15, 20);
      ctx.lineTo(26, 32 - wave * 18);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      // Head
      ctx.fillStyle = skin;
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Hair cap
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.arc(0, -3, 18, Math.PI, 0);
      ctx.fill();
      ctx.stroke();

      // Eyes
      ctx.fillStyle = "#111827";
      const eyeShift = facing * 3;
      ctx.beginPath();
      ctx.arc(-5 + eyeShift, 1, 2.2, 0, Math.PI * 2);
      ctx.arc(5 + eyeShift, 1, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // Smile
      ctx.beginPath();
      ctx.arc(eyeShift, 5, 5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawSuperheroFigure(x, y, scale, hero, bobOffset = 0) {
      ctx.save();
      ctx.translate(x, y + bobOffset);
      ctx.scale(scale, scale);

      // Flowing Cape
      if (hero.hasCape !== false) {
        ctx.fillStyle = hero.capeColor || "#facc15";
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-14, -8);
        ctx.quadraticCurveTo(-36, 18, -28, 46);
        ctx.lineTo(28, 46);
        ctx.quadraticCurveTo(36, 18, 14, -8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Legs
      ctx.fillStyle = hero.suitColor;
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2.5;
      roundRectPath(-14, 24, 11, 24, 5);
      ctx.fill(); ctx.stroke();
      roundRectPath(3, 24, 11, 24, 5);
      ctx.fill(); ctx.stroke();

      // Heroic Torso
      ctx.fillStyle = hero.suitColor;
      roundRectPath(-18, -10, 36, 36, 10);
      ctx.fill(); ctx.stroke();

      // Belt
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-17, 17, 34, 6);
      ctx.strokeRect(-17, 17, 34, 6);

      // Chest Emblem
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 4, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "13px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(hero.emblem || "⚡", 0, 5);

      // Heroic Arms (Hands on hips / triumphant pose)
      ctx.strokeStyle = hero.suitColor;
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-18, -4);
      ctx.lineTo(-27, 8);
      ctx.lineTo(-18, 18);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(18, -4);
      ctx.lineTo(27, -18);
      ctx.stroke();

      // Head & Hero Mask
      ctx.fillStyle = "#fde68a";
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "#111827";
      ctx.beginPath();
      ctx.arc(0, -25, 15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Mask band
      ctx.fillStyle = hero.capeColor || "#111827";
      roundRectPath(-14, -30, 28, 8, 4);
      ctx.fill(); ctx.stroke();

      // Eyes
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-5, -26, 2.5, 0, Math.PI * 2);
      ctx.arc(5, -26, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Confident Grin
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -20, 5, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // =========================================================================
    // SCENE RENDERERS FOR EACH OF THE 5 TABS
    // =========================================================================
    function renderScene0_Overview(W, H, p, t) {
      drawClassroomBackdrop(W, H);

      // Projector Screen at front center
      const scrW = W * 0.36;
      const scrH = H * 0.34;
      const scrX = (W - scrW) / 2;
      const scrY = H * 0.08;
      drawComicBox(scrX, scrY, scrW, scrH, "#ffffff", "#111827", 3, 10, 5);
      ctx.fillStyle = "#1d4ed8";
      ctx.font = `900 ${Math.max(12, W * 0.02)}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("SUPERHERO SLIDES", scrX + scrW / 2, scrY + scrH * 0.32);

      // Laptop on desk next to screen
      drawComicBox(scrX - 58, H * 0.56, 46, 28, "#64748b", "#111827", 2, 4, 2);

      // Proctor Mr. Jose
      const bounce = Math.sin(t * 4) * 3;
      drawChibiPerson(scrX + scrW + 42, H * 0.55 + bounce, 1.05, {
        shirt: "#1d4ed8",
        isProctor: true,
        wave: p > 70 ? Math.abs(Math.sin(t * 5)) : 0.2,
        facing: -1
      });

      // Three Group Tables with Students & Poster Sheets
      const tables = [W * 0.2, W * 0.5, W * 0.8];
      tables.forEach((tx, idx) => {
        const ty = H * 0.77;
        // Students behind table
        drawChibiPerson(tx - 28, ty - 24, 0.85, { shirt: idx === 0 ? "#ef4444" : idx === 1 ? "#10b981" : "#8b5cf6" });
        drawChibiPerson(tx + 28, ty - 24, 0.85, { shirt: "#f59e0b" });

        // Group Table
        drawComicBox(tx - 62, ty, 124, 38, "#fef3c7", "#111827", 2.5, 8, 4);

        // Large Poster Paper appearing on table as setup progresses
        if (p >= 45) {
          drawComicBox(tx - 34, ty + 5, 68, 24, "#ffffff", "#2563eb", 2, 4, 0);
          ctx.fillStyle = "#111827";
          ctx.font = "800 9px sans-serif";
          ctx.fillText(`GROUP ${idx + 1}`, tx, ty + 18);
        }
      });

      // Proctor Speech Bubble
      const msg = p < 50
        ? "Welcome to SAARD Camp! Let's check our slides & art supplies."
        : "Invent your OWN original superhero—don't copy existing ones!";
      drawSpeechBubble(W * 0.58, H * 0.14, W * 0.37, H * 0.22, scrX + scrW + 32, H * 0.48, msg, "#fef08a", Math.max(11, W * 0.016));
    }

    function renderScene1_Stage1(W, H, p, t) {
      drawClassroomBackdrop(W, H);

      // Auto-advance slide if user hasn't clicked manual controls
      if (!state.manualSlideOverride) {
        const autoIdx = Math.floor((p / 100) * SAMPLE_SLIDES.length) % SAMPLE_SLIDES.length;
        if (autoIdx !== state.slideIndex) {
          state.slideIndex = autoIdx;
          renderContextualBar();
          renderRightPanel();
        }
      }

      const slide = SAMPLE_SLIDES[state.slideIndex];

      // Large Projector Screen
      const scrW = W * 0.48;
      const scrH = H * 0.46;
      const scrX = W * 0.26;
      const scrY = H * 0.06;
      drawComicBox(scrX, scrY, scrW, scrH, "#ffffff", "#111827", 3.5, 14, 6);

      // Slide Header Strip
      ctx.fillStyle = slide.suitColor;
      roundRectPath(scrX + 4, scrY + 4, scrW - 8, scrH * 0.2, 10);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = `900 ${Math.max(13, W * 0.022)}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(slide.name, scrX + scrW / 2, scrY + scrH * 0.14);

      // Superhero Drawing inside Slide
      const floatY = Math.sin(t * 4) * 4;
      drawSuperheroFigure(scrX + scrW * 0.24, scrY + scrH * 0.58, Math.min(1.15, W / 650), slide, floatY);

      // Catchphrase & Power text on right half of slide
      ctx.fillStyle = "#111827";
      ctx.font = `800 ${Math.max(10, W * 0.015)}px "Segoe UI", sans-serif`;
      wrapText(slide.catchphrase, scrX + scrW * 0.68, scrY + scrH * 0.44, scrW * 0.52, 16);

      ctx.fillStyle = "#2563eb";
      ctx.font = `700 ${Math.max(9.5, W * 0.0135)}px "Segoe UI", sans-serif`;
      wrapText(slide.power, scrX + scrW * 0.68, scrY + scrH * 0.76, scrW * 0.52, 15);

      // Proctor pointing to screen
      drawChibiPerson(W * 0.14, H * 0.56, 1.05, { shirt: "#1d4ed8", isProctor: true, wave: 0.7, facing: 1 });

      // Students reading aloud in unison
      const studentXs = [W * 0.25, W * 0.5, W * 0.75];
      studentXs.forEach((sx, i) => {
        drawChibiPerson(sx, H * 0.8, 0.95, {
          shirt: i === 0 ? "#ef4444" : i === 1 ? "#10b981" : "#f59e0b",
          wave: Math.abs(Math.sin(t * 5 + i)) * 0.6
        });
      });

      // Interactive Dialogue Bubbles
      if (p < 50) {
        drawSpeechBubble(W * 0.04, H * 0.2, W * 0.2, H * 0.2, W * 0.14, H * 0.48, `Read aloud: "${slide.name}!"`, "#fef08a", 11.5);
        drawSpeechBubble(W * 0.56, H * 0.56, W * 0.38, H * 0.16, W * 0.5, H * 0.72, `Students: "${slide.name}! ${slide.catchphrase}"`, "#dbeafe", 11.5);
      } else {
        drawSpeechBubble(W * 0.04, H * 0.2, W * 0.2, H * 0.2, W * 0.14, H * 0.48, "What can this hero do to help people?", "#fef08a", 11.5);
        drawSpeechBubble(W * 0.56, H * 0.56, W * 0.38, H * 0.16, W * 0.75, H * 0.72, `Student: "${slide.helps}"`, "#dcfce7", 11.5);
      }
    }

    function renderScene2_Stage2(W, H, p, t) {
      drawClassroomBackdrop(W, H);

      // 4 Students gathered around large group table
      const cx = W * 0.5;
      const tableY = H * 0.64;

      drawChibiPerson(cx - 125, tableY - 26, 0.95, { shirt: "#ef4444", wave: Math.abs(Math.sin(t * 4)) * 0.5, facing: 1 });
      drawChibiPerson(cx - 45, tableY - 34, 0.95, { shirt: "#2563eb", wave: 0.2, facing: 1 });
      drawChibiPerson(cx + 45, tableY - 34, 0.95, { shirt: "#10b981", wave: 0.3, facing: -1 });
      drawChibiPerson(cx + 125, tableY - 26, 0.95, { shirt: "#f59e0b", wave: Math.abs(Math.cos(t * 4)) * 0.5, facing: -1 });

      // Large Art Table
      drawComicBox(cx - 185, tableY, 370, 86, "#fde68a", "#111827", 3, 14, 6);

      // Art Supplies (Markers, Crayons, Ruler)
      drawComicBox(cx - 165, tableY + 14, 12, 42, "#ef4444", "#111827", 1.5, 3, 0);
      drawComicBox(cx - 148, tableY + 18, 12, 38, "#2563eb", "#111827", 1.5, 3, 0);
      drawComicBox(cx + 142, tableY + 16, 18, 48, "#facc15", "#111827", 1.5, 3, 0);

      // Center Large Poster Paper (Interactive Preview of Mini Superhero Builder!)
      const postW = 230;
      const postH = 195;
      const postX = cx - postW / 2;
      const postY = H * 0.14;
      drawComicBox(postX, postY, postW, postH, "#ffffff", "#111827", 3.5, 12, 6);

      // Poster Title Header
      ctx.fillStyle = state.heroBuilder.suitColor;
      roundRectPath(postX + 4, postY + 4, postW - 8, 30, 8);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = `900 13px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(state.heroBuilder.name, cx, postY + 20);

      // Draw Custom Superhero on the Poster
      const bob = Math.sin(t * 3.5) * 3;
      drawSuperheroFigure(cx, postY + 95, 1.15, state.heroBuilder, bob);

      // Catchphrase Banner at Bottom of Poster
      drawComicBox(postX + 10, postY + postH - 42, postW - 20, 32, "#fef9c3", "#111827", 2, 8, 0);
      ctx.fillStyle = "#111827";
      ctx.font = `700 10px "Segoe UI", sans-serif`;
      wrapText(state.heroBuilder.catchphrase, cx, postY + postH - 26, postW - 28, 12);

      // Group Brainstorming Speech Bubbles
      drawSpeechBubble(W * 0.03, H * 0.22, W * 0.23, H * 0.19, cx - 125, tableY - 42, "Let's give our hero a bright emblem & cape!", "#dbeafe", 11);
      drawSpeechBubble(W * 0.74, H * 0.22, W * 0.23, H * 0.19, cx + 125, tableY - 42, "Now let's write a catchy line everyone can say!", "#dcfce7", 11);
    }

    function renderScene3_Stage3(W, H, p, t) {
      drawClassroomBackdrop(W, H);

      // Auto-cycle Helpful English Expressions unless user selected one manually
      if (!state.manualExprOverride) {
        const autoExpr = Math.floor((p / 100) * HELPFUL_EXPRESSIONS.length) % HELPFUL_EXPRESSIONS.length;
        if (autoExpr !== state.selectedExprIndex) {
          state.selectedExprIndex = autoExpr;
          updatePlaybackUI();
        }
      }

      const expr = HELPFUL_EXPRESSIONS[state.selectedExprIndex];

      // Presenting Group at Front Left-Center
      const pX = W * 0.34;
      const pY = H * 0.56;
      drawChibiPerson(pX - 75, pY, 1.0, { shirt: "#10b981", wave: 0.4 });
      drawChibiPerson(pX + 75, pY, 1.0, { shirt: "#2563eb", wave: 0.6 });

      // Finished Poster Held Up by the Presenting Team
      const postW = 140;
      const postH = 148;
      const postX = pX - postW / 2;
      const postY = pY - 62 + Math.sin(t * 3) * 2;
      drawComicBox(postX, postY, postW, postH, "#ffffff", "#111827", 3, 10, 5);
      ctx.fillStyle = state.heroBuilder.suitColor;
      roundRectPath(postX + 3, postY + 3, postW - 6, 24, 7);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = `900 10.5px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(state.heroBuilder.name, pX, postY + 15);
      drawSuperheroFigure(pX, postY + 76, 0.88, state.heroBuilder, 0);

      // Presentation Speech Bubble cycling through Helpful English Expressions
      drawSpeechBubble(
        W * 0.04,
        H * 0.14,
        W * 0.44,
        H * 0.22,
        pX - 55,
        pY - 22,
        `${expr.phrase}\n"${expr.sample}"`,
        "#fef08a",
        Math.max(11, W * 0.0155)
      );

      // Proctor Mr. Jose Listening & Facilitating Q&A on Right
      drawChibiPerson(W * 0.84, H * 0.54, 1.05, { shirt: "#1d4ed8", isProctor: true, facing: -1, wave: p > 75 ? 0.8 : 0.1 });

      // Audience Classmates Listening Respectfully & Clapping
      const audXs = [W * 0.58, W * 0.70, W * 0.82];
      audXs.forEach((ax, i) => {
        const clapWave = p > 75 ? Math.abs(Math.sin(t * 10 + i)) : 0.15;
        drawChibiPerson(ax, H * 0.81, 0.9, {
          shirt: i === 0 ? "#f59e0b" : i === 1 ? "#ef4444" : "#8b5cf6",
          wave: clapWave,
          facing: -1
        });
      });

      if (p > 75) {
        drawSpeechBubble(W * 0.56, H * 0.18, W * 0.39, H * 0.18, W * 0.84, H * 0.45, "👏 Great presentation! Audience, do you have one short question?", "#dcfce7", 11);
      }
    }

    function renderScene4_Scoring(W, H, p, t) {
      drawClassroomBackdrop(W, H);

      const total = state.scores.creativity + state.scores.catchphrase + state.scores.explanation + state.scores.teamwork;

      // Trophy Podium Card
      const cardW = W * 0.56;
      const cardH = H * 0.64;
      const cardX = (W - cardW) / 2;
      const cardY = H * 0.12;
      drawComicBox(cardX, cardY, cardW, cardH, "#ffffff", "#111827", 3.5, 16, 7);

      ctx.fillStyle = "#1d4ed8";
      ctx.font = `900 ${Math.max(14, W * 0.022)}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("🏆 SUPERHERO JUDGING SCOREBOARD", W / 2, cardY + 26);

      // Animated Score Bars
      const items = [
        { label: "Creativity & Drawing", val: state.scores.creativity, max: 3, color: "#ef4444" },
        { label: "Memorable Catchphrase", val: state.scores.catchphrase, max: 2, color: "#f59e0b" },
        { label: "Powers & Helping People", val: state.scores.explanation, max: 3, color: "#10b981" },
        { label: "Teamwork & Presentation", val: state.scores.teamwork, max: 2, color: "#2563eb" }
      ];

      items.forEach((it, idx) => {
        const rowY = cardY + 52 + idx * ((cardH - 108) / 4);
        ctx.fillStyle = "#111827";
        ctx.font = "700 11.5px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${it.label} (${it.val}/${it.max})`, cardX + 18, rowY);

        const barX = cardX + 18;
        const barW = cardW - 36;
        const barH = 14;
        drawComicBox(barX, rowY + 6, barW, barH, "#e5e7eb", "#111827", 2, 6, 0);

        const animFill = Math.min(1, (p / 35) + 0.35);
        const fillW = barW * (it.val / it.max) * animFill;
        if (fillW > 2) {
          ctx.fillStyle = it.color;
          roundRectPath(barX + 1, rowY + 7, Math.max(8, fillW - 2), barH - 2, 5);
          ctx.fill();
        }
      });

      // Total Score Badge
      drawComicBox(W / 2 - 85, cardY + cardH - 44, 170, 34, "#facc15", "#111827", 2.5, 10, 3);
      ctx.fillStyle = "#111827";
      ctx.font = `900 15px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(`TOTAL: ${total} / 10 PTS`, W / 2, cardY + cardH - 26);

      // Celebrating Superhero & Proctor Flanking the Scoreboard
      drawSuperheroFigure(W * 0.12, H * 0.58, 1.15, state.heroBuilder, Math.sin(t * 5) * 6);
      drawChibiPerson(W * 0.88, H * 0.62, 1.1, { shirt: "#1d4ed8", isProctor: true, wave: Math.abs(Math.sin(t * 6)), facing: -1 });
    }

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================
    function animate(timestamp) {
      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const dt = timestamp - state.lastTimestamp;
      state.lastTimestamp = timestamp;

      if (state.isPlaying) {
        state.progress += (dt / state.cycleDuration) * 100 * state.speed;
        if (state.progress >= 100) {
          state.progress = 0;
          state.manualSlideOverride = false;
          state.manualExprOverride = false;
        }
        updatePlaybackUI();
      }

      const dpr = window.devicePixelRatio || 1;
      const W = canvas.width / dpr;
      const H = canvas.height / dpr;
      const t = timestamp / 1000;

      ctx.clearRect(0, 0, W, H);

      switch (state.activeTab) {
        case 0: renderScene0_Overview(W, H, state.progress, t); break;
        case 1: renderScene1_Stage1(W, H, state.progress, t); break;
        case 2: renderScene2_Stage2(W, H, state.progress, t); break;
        case 3: renderScene3_Stage3(W, H, state.progress, t); break;
        case 4: renderScene4_Scoring(W, H, state.progress, t); break;
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // INITIALIZE APPLICATION
    // =========================================================================
    window.onload = function () {
      resizeCanvas();
      selectTab(0);
      requestAnimationFrame(animate);
    };
  </script>
</body>
